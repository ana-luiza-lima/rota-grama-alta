<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <div class="header-container">
            <h1>RELATORIOS</h1>
            <button class="btn-secundario"><a href="index.html">VOLTAR</a></button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">TOTAL DE COMPRAS</div>
                <div class="stat-value">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">RECEITA TOTAL</div>
                <div class="stat-value">R$ 0,00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">CLIENTES</div>
                <div class="stat-value">0</div>
            </div>
        </div>

        <div class="search-card">
            <h2>BUSCAR</h2>
            <div class="search-controles">
                <select>
                    <option>TODAS</option>
                    <option>POR ID</option>
                    <option>POR USUARIO</option>
                    <option>POR DATA</option>
                </select>
                <input type="text" placeholder="Digite para buscar...">
                <button>EXPORTAR</button>
            </div>
        </div>

        <div class="table-card">
            <table>
                <thead>
                    <tr>
                        <th>ID COMPRA</th>
                        <th>USUARIO</th>
                        <th>DATA</th>
                        <th>ITENS</th>
                        <th>VALOR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="5" class="empty-message">Nenhuma compra encontrada</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer></footer>

    <script src="script.js" defer></script>
</body>
</html>
