<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="footer-ancorado">
    <header>
        <div class="header-container">
            <h1>RELATORIOS DO ADMINISTRADOR</h1>
            <button class="btn-secundario" id="btnSairAdmin" type="button" onclick="sairAdmin()">SAIR</button>
        </div>
    </header>

    <main>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">CLIENTES</div>
                <div class="stat-value" id="totalClientes">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">COMPRAS</div>
                <div class="stat-value" id="totalComprasAdmin">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">RECEITA TOTAL</div>
                <div class="stat-value" id="receitaTotalAdmin">R$ 0,00</div>
            </div>
        </div>

        <div class="search-card">
            <h2>RELATÓRIO DE CLIENTES</h2>
            <div class="search-controles">
                <input type="text" id="buscarClienteInput" placeholder="Pesquisar por nome, ID, e-mail ou CPF...">
            </div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NOME</th>
                            <th>EMAIL</th>
                            <th>CPF</th>
                            <th>COMPRAS</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyClientesAdmin">
                        <tr>
                            <td colspan="5" class="empty-message">Nenhum cliente encontrado</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="search-card">
            <h2>BUSCA DE COMPRAS</h2>
            <div class="search-controles">
                <select id="filtroCompraAdmin">
                    <option value="todas">TODAS</option>
                    <option value="id">POR ID</option>
                    <option value="cliente">POR CLIENTE</option>
                    <option value="data">POR DATA</option>
                    <option value="valor">POR VALOR</option>
                    <option value="produto">POR PRODUTO</option>
                </select>
                <input type="text" id="buscarCompraInput" placeholder="Digite para buscar...">
            </div>
            <div class="table-card">
                <table>
                    <thead>
                        <tr>
                            <th>ID COMPRA</th>
                            <th>CLIENTE</th>
                            <th>DATA</th>
                            <th>ITENS</th>
                            <th>VALOR</th>
                        </tr>
                    </thead>
                    <tbody id="tbodyComprasAdmin">
                        <tr>
                            <td colspan="5" class="empty-message">Nenhuma compra encontrada</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js" defer></script>
</body>
</html>
