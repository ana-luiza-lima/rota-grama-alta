<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-bg">
    <div class="login-container">
        <h1>ROTA GRAMA ALTA</h1>
        <p class="subtitulo">Faça login para continuar sua jornada</p>

        <form>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Senha:</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <button type="submit">ENTRAR</button>
        </form>

        <div class="divisor">
            <p>Não tem conta? <a href="cadastro.html">CADASTRE-SE</a></p>
            <button type="button" class="divisor-link" id="btnLoginAdmin">LOGIN DE ADMINISTRADOR</button>
        </div>

        <a href="index.html" class="back-link">← Voltar</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
