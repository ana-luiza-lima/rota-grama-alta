<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Conta - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="footer-ancorado">
    <header>
        <div class="header-container">
            <h1>MINHA CONTA</h1>
            <button class="btn-secundario" id="btnSair" type="button">SAIR</button>
                        
        </div>
    </header>

    <main>
        <div class="content-grid">
            <div>
                <div class="card card-informacoes">
                    <h2>INFORMACOES</h2>
                    <button type="button" class="btn-editar-conta" id="btnEditarConta" aria-label="Editar informações">✎</button>
                    <div class="info-group">
                        <div class="info-label">NOME</div>
                        <div class="info-valor" id="contaNome">Seu Nome</div>
                    </div>
                    <div class="info-group">
                        <div class="info-label">EMAIL</div>
                        <div class="info-valor" id="contaEmail">seu@email.com</div>
                    </div>
                    <div class="info-group">
                        <div class="info-label">CPF</div>
                        <div class="info-valor" id="contaCpf">000.000.000-00</div>
                    </div>
                    <div class="info-group">
                        <div class="info-label">ID</div>
                        <div class="info-valor" id="contaId">C001</div>
                    </div>
                </div>

                <div class="card" style="margin-top: 1rem;">
                    <h2>MINHAS COMPRAS</h2>
                    <p id="mensagemCompras" style="font-weight: bold; margin-bottom: 1rem;">Você ainda não realizou nenhuma compra.</p>
                    <div id="listaCompras" style="display: none;">
                        <div class="order-item">
                            <div>
                                <div class="id-pedido">COMPRA CP001</div>
                                <div class="data-pedido">01/06/2026</div>
                            </div>
                            <div class="valor-pedido">R$ 800,00</div>
                        </div>
                    </div>
                </div>
            </div>

            <div>
                <div class="sumario-card">
                    <div class="sumario-label">TOTAL DE COMPRAS</div>
                    <div class="sumario-value" id="totalCompras">0</div>
                </div>
                <div class="sumario-card">
                    <div class="sumario-label">GASTO TOTAL</div>
                    <div class="sumario-value" id="gastoTotal">R$ 0,00</div>
                </div>
                <button class="btn-secundario" id="btnVoltar" type="button"> VOLTAR </button>
            </div>
        </div>
    </main>

    <footer></footer>

    <div id="modalCompra" class="modal-overlay-conta" aria-hidden="true">
        <div class="modal-conteudo-conta">
            <div class="modal-header-conta">
                <h2>DETALHES DA COMPRA</h2>
                <button type="button" class="modal-fechar-conta" id="btnFecharModalCompra">✕</button>
            </div>
            <div id="modalCompraConteudo"></div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
