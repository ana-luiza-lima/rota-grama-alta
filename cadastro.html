<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="cadastro-bg">
    <div class="cadastro-container">
        <h1>NOVO TREINADOR</h1>
        <p class="subtitulo">Crie sua conta na Rota de Grama Alta</p>

        <form>
            <div class="form-group">
                <label for="name">NOME:</label>
                <input type="text" id="name" placeholder="Seu nome" required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL:</label>
                <input type="email" id="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label for="password">SENHA:</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">CONFIRMAR SENHA:</label>
                <input type="password" id="confirm-password" placeholder="Confirme sua senha" required>
            </div>

            <button type="submit">CADASTRAR</button>
        </form>

        <div class="divisor">
            <p>Já tem conta? <a href="login.html">FAÇA LOGIN</a></p>
        </div>

        <a href="index.html" class="back-link">← Voltar</a>
    </div>
    <script src="script.js"></script>
</body>
</html>
