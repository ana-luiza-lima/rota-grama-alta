<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Grama Alta - Centro Pokémon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>


<body>
   <header>
        <div class="header-container">
            <div class="header-esquerdo">
                <h1>ROTA GRAMA ALTA</h1>
            </div>
            <div class="header-direito">
                <button class="btn-secundario" id="btnSobre" type="button"> SOBRE </button>
                <button class="btn-secundario" id="btnConta" type="button"> CONTA </button> 
                <button class="btn-secundario" id="btnCarrinho" type="button"> CARRINHO</button>
            </div>
        </div>
    </header>

    <section class="banner">
        <div class="banner-conteudo">
            <h2>POKEDEX DISPONIVEL</h2>
            <p>Escolha seu Pokémon e comece sua jornada!</p>
        </div>
    </section>

    <main>
        <div class="main-conteudo">
            <h2 class="section-titulo">POKEMONS DISPONIVEIS</h2>
            <div class="section-divisor"></div>

            <div class="pokemon-filtros">
                <div class="pokemon-filtro-campo">
                    <label for="filtroNomePokemon">Buscar por nome</label>
                    <input type="text" id="filtroNomePokemon" placeholder="Digite o nome do Pokémon">
                </div>
                <div class="pokemon-filtro-campo">
                    <label for="filtroTipoPokemon">Filtrar por tipo</label>
                    <select id="filtroTipoPokemon">
                        <option value="">Todos os tipos</option>
                    </select>
                </div>
            </div>


            <div class="pokemon-grid"></div>
        </div>
    </main>

    <footer></footer>
    <script src="script.js" defer></script>
</body>
</html>
