
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Pokémons - Rota Grama Alta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="footer-ancorado">

    <header>
        <div class="header-container">
            <h1>MEUS POKEMONS</h1>
        <button class="btn-secundario" id="btnVoltar" type="button"> VOLTAR </button>
        </div>
    </header>

    <main>
        <div class="carrinho-vazio">
            <p>Sua Pokebola está vazia</p>
            <button class="btn-secundario" id="btnPokedex" type="button"> IR PARA POKEDEX</button>
        </div>

        <div style="display: none;">
            <div class="carrinho-item">

                <div class="carrinho-item-info">
                    <div class="carrinho-item-nome"> </div>
                    <div class="carrinho-item-preco"> </div>
                </div>
                <div class="carrinho-item-controles">
                    <input type="number" value="1" min="1">
                    <button>X</button>
                </div>
                <div class="carrinho-item-preco">R$ 0,00 </div>
            </div>

            <div class="carrinho-sumario">
                <div class="sumario-row">
                    <span>Subtotal:</span>
                    <span>R$ 0,00 </span>
                </div>
                <div class="sumario-row">
                    <span>R$ 0,00 </span>
                </div>
                <div class="sumario-row sumario-total">
                    <span>Total:</span>
                    <span>R$ 0,00</span>
                </div>
                <button class="checkout-btn">FINALIZAR COMPRA</button>
            </div>
        </div>
    </main>

    <footer></footer>

    <script src="script.js" defer></script>
</body>

</html>
